# ============================================================================
#  Forza Horizon (NTSC-U, Title ID 4D5309C9, default.xex v0.0.0.10) — manual
#  declarations for the codegen. Included from fh1_manifest.toml.
#  Flat schema: sections at the root. Format explained in
#  nfsmw-nx's app/overrides.toml.
# ============================================================================

# setjmp / longjmp (XDK CRT). The game's libjpeg (paint shop, sub_82A1xxxx-82A2xxxx) reports
# decode errors with longjmp back to its setjmp. Translated code cannot jump like that unless the
# codegen knows these two: without them the error handler returned, the decoder carried on with a
# torn-down state and read through a null pointer (crash entering the design creator, 2026-10-01:
# sub_82A1CFB0 reading [0+420] = cinfo->global_state).
#   setjmp  0x82A81E80: stores f14-f31, r13-r31, v64-v127, LR, CR, SP to [r3], returns 0
#   longjmp 0x82A81950: reloads that buffer (r7 = r3), returns r4 (1 if 0); 8 call sites
setjmp_address = 0x82A81E80
longjmp_address = 0x82A81950

[functions]

# Tail calls (b) whose targets automatic discovery never turned into
# functions. The first codegen failed Validate with
#   UnresolvedCall: <target> - target not in any function
# Declaring each target as an entry point is enough; Discover finds the bounds.
# If any of them turns out to read registers set by the function that jumps
# to it, it needs share_registers = true (see tools/read_before_write.py).

# 0x82B1ABD0..0x82B1AC08: a run of 8-byte stubs, jumped to from 0x82B13498..0x82B13588.
"0x82B1ABD0" = { }
"0x82B1ABE8" = { }
"0x82B1ABF0" = { }
"0x82B1ABF8" = { }
"0x82B1AC00" = { }
"0x82B1AC08" = { }

"0x82CF87F8" = { }   # from 0x82CED38C
"0x82F1ED30" = { }   # from 0x82F1EF58 and 0x82F029F4
"0x82F5CCDC" = { }   # from 0x82F5CCEC
"0x82F761F4" = { }   # from 0x82F76204
"0x82F7630C" = { }   # from 0x82F7631C

# Second level: the stubs above jump on into another run of 8-byte stubs.
"0x82B3B8B0" = { }   # from 0x82B1ABEC
"0x82B3B8B8" = { }   # from 0x82B1ABF4
"0x82B3B8C0" = { }   # from 0x82B1ABFC
"0x82B3B8C8" = { }   # from 0x82B1AC04

# ---------------------------------------------------------------------------
#  Function bounds
# ---------------------------------------------------------------------------

# A switch built from a chain of bdz; two cases jump to 0x82AD836C, the last
# instruction before the next function (0x82AD8370). Discover ended the
# function one instruction early, so the codegen emitted
#   "bdz at 82AD8138 branches outside function to 82AD836C" -> return;
# and those cases returned silently.
"0x82AD80D0" = { end = 0x82AD8370 }

# 0x830ED900 ends in bl KeBugCheck, which never returns. Discover did not know
# that and ran on into the next function, so "b 0x830ED910" from the stub at
# 0x830EBE90 pointed into the middle of 0x830ED900 (REX_FATAL at run time).
"0x830ED900" = { end = 0x830ED910 }
"0x830ED910" = { }

# ---------------------------------------------------------------------------
#  Xbox SDK fibers -> host fibers (sdk/src/kernel/crt/threading.cpp)
# ---------------------------------------------------------------------------
# The game links the XDK's fiber functions (xapilib). Its SwitchToFiber saves every
# register into the current fiber and jumps into the target fiber's saved context,
# which translated code cannot do: the call returned with garbage non-volatile
# registers (r20 = 0 after sub_8310C640 -> 0x830EBE90 -> 0x830ED910), and pressing
# Start crashed on a null read in sub_8310C340. The SDK replaces the whole family
# with real host fibers; they must be hooked together because SwitchToFiber only
# knows fibers created by the SDK's CreateFiber / ConvertThreadToFiber.
# Identified by reading the generated code (KTHREAD+0x164 = current fiber, 0xA50-byte
# fiber block, ERROR_ALREADY_FIBER 1280 / ERROR_ALREADY_THREAD 1281):
#   0x830EBC60 GetCurrentFiber (reads KTHREAD+0x164; same layout in the SDK, not hooked)
#   0x830EBE90 4-byte stub "b 0x830ED910" that every caller of SwitchToFiber uses
#   0x830ED900 / 0x830EBEA0 start trampoline of XDK fibers (unused once CreateFiber is hooked)
[rexcrt]
ConvertThreadToFiber = 0x830EBC70
ConvertFiberToThread = 0x830EBD00
CreateFiber = 0x830EBD50
DeleteFiber = 0x830EBE30
SwitchToFiber = 0x830ED910
